name: studypulse
description: StudyPulse —— 你的 Obsidian 学习系统的安卓执行终端（今天做什么 / 打卡 / 复盘）
publish_to: 'none'
version: 1.3.2+8

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 网络请求（GitHub Contents API，只读）
  http: ^1.2.0
  # 本地每日推送
  flutter_local_notifications: ^17.2.2
  # 通知定时所需时区
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # 本地存储（Token / 设置 / 缓存 / 学习记录）
  shared_preferences: ^2.2.3
  # 本地文件路径
  path_provider: ^2.1.3
  # 日期格式化
  intl: ^0.19.0
  # 打开外部链接（Token 创建指引）
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
